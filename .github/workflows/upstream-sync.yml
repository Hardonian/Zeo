name: Upstream Sync

on:
    schedule:
        - cron: "0 0 * * *" # Daily at midnight
    workflow_dispatch: # Manual trigger

permissions:
    contents: write
    pull-requests: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.5

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"

            - name: Install
              run: pnpm i

            - name: Run Upstream Sync
              run: node scripts/upstream-sync.mjs
              env:
                  SKIP_GIT_PULL: "false"

            - name: Commit and Push Changes
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  BRANCH="upstream-sync-auto"

                  # Check for changes
                  if git diff --quiet && git diff --cached --quiet; then
                    echo "No changes to sync."
                    exit 0
                  fi

                  # Commit and push
                  git checkout -B "$BRANCH"
                  git add -A
                  git commit -m "chore: upstream sync for policy engine and core"
                  git push --force-with-lease origin "$BRANCH"
                  echo "Sync branch pushed to origin/$BRANCH"

                  # Attempt PR creation (may fail if repo setting blocks it)
                  # Enable "Allow GitHub Actions to create and approve pull requests" in repo Settings > Actions
                  if gh pr create --base main --head "$BRANCH" \
                    --title "Upstream Sync: Policy & Core Hardening" \
                    --body "Automated upstream sync from ReadyLayer and ControlPlane." \
                    --label "upstream,automated-pr" 2>/dev/null; then
                    echo "Pull request created successfully."
                  else
                    echo "::warning::Could not create PR automatically. Enable 'Allow GitHub Actions to create and approve pull requests' in repo Settings > Actions, or create the PR manually from branch '$BRANCH'."
                  fi
