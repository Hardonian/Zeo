name: Upstream Sync

on:
    schedule:
        - cron: "0 0 * * *" # Daily at midnight
    workflow_dispatch: # Manual trigger

permissions:
    contents: write
    pull-requests: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.5

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"

            - name: Install
              run: pnpm i

            - name: Run Upstream Sync
              run: node scripts/upstream-sync.mjs
              env:
                  SKIP_GIT_PULL: "false"

            - name: Commit and Push Changes
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  BRANCH="upstream-sync-auto"
                  TITLE="Upstream Sync: Policy & Core Hardening"
                  BODY=$(cat <<'EOF'
                  Automated upstream sync from ReadyLayer and ControlPlane.

                  This PR incorporates the latest transformations for:
                  - PolicyEngine Service abstraction (StorageProvider)
                  - OTEL Tracing integration
                  - Security hardening
                  EOF
                  )

                  # Check for changes
                  if git diff --quiet && git diff --cached --quiet; then
                    echo "No changes to sync."
                    exit 0
                  fi

                  # Commit and push
                  git checkout -B "$BRANCH"
                  git add -A
                  git commit -m "chore: upstream sync for policy engine and core"
                  git push --force-with-lease origin "$BRANCH"

                  # Create or update PR
                  EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
                  if [ -n "$EXISTING_PR" ]; then
                    gh pr edit "$EXISTING_PR" --title "$TITLE" --body "$BODY"
                    echo "Updated existing PR #$EXISTING_PR"
                  else
                    gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY" --label "upstream,automated-pr"
                    echo "Created new PR"
                  fi
