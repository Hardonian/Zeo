name: Meeting Notes Issue Drafts

on:
  workflow_dispatch:
    inputs:
      notes_path:
        description: 'Path to markdown meeting notes'
        required: true
        default: 'docs/meeting-notes.md'

permissions:
  contents: write

jobs:
  draft-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v7
        with:
          node-version: 20.11.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/meeting-notes-to-issues.mjs "${{ github.event.inputs.notes_path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: issue-drafts
          path: docs/generated/issue-drafts.json
