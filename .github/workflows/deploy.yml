name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: "pnpm"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify production release
        run: |
          pnpm typecheck
          pnpm test:ci

  deploy-api:
    needs: verify-release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing production secret: CF_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing production secret: CF_ACCOUNT_ID"; exit 1; }
          test -n "$DOMAIN" || { echo "Missing production variable: DOMAIN"; exit 1; }
      - name: Apply and verify D1 schema
        working-directory: deploy/workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          wrangler d1 execute zeo --remote --file=../d1/schema.sql
          wrangler d1 execute zeo --remote --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name = 'audits';"
      - name: Deploy to Cloudflare Workers
        working-directory: deploy/workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: wrangler deploy --minify
      - name: Smoke test
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          RESPONSE=$(curl --fail --show-error --retry 12 --retry-all-errors --retry-delay 2 --max-time 15 "https://${DOMAIN}/health")
          printf '%s' "$RESPONSE" | node --input-type=module -e '
            let payload;
            try {
              payload = JSON.parse(await new Response(process.stdin).text());
            } catch {
              throw new Error("Health endpoint did not return JSON");
            }
            if (payload.status !== "ok" || payload.service !== "zeo-api") {
              throw new Error("Health endpoint returned an unexpected payload");
            }
          '

  deploy-frontend:
    needs: verify-release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing production secret: CF_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing production secret: CF_ACCOUNT_ID"; exit 1; }
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: ${{ github.event.repository.name }}
          directory: deploy/frontend
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
