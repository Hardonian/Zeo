name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.0
          cache: pnpm
      - name: Install
        run: pnpm run ci:install
      - name: Doctor
        run: pnpm doctor
      - name: Verify
        run: pnpm verify
