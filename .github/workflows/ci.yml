name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: 20.11.0
  PNPM_VERSION: 9.15.5

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-
      - name: Install
        run: pnpm run ci:install
      - name: Lint
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee lint.log
      - name: Upload lint log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-log
          path: lint.log

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-
      - name: Install
        run: pnpm run ci:install
      - name: Typecheck
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log
      - name: Upload typecheck log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-
      - name: Install
        run: pnpm run ci:install
      - name: Unit tests
        run: |
          set -o pipefail
          pnpm test:ci 2>&1 | tee unit-tests.log
      - name: Golden tests (PR lane)
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          pnpm test:golden:pr 2>&1 | tee golden-pr.log
      - name: Golden tests (main lane)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          pnpm test:golden 2>&1 | tee golden-main.log
      - name: Upload golden artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-artifacts
          path: tests/golden/artifacts/
      - name: Upload unit logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-failure-logs
          path: |
            unit-tests.log
            golden-pr.log
            golden-main.log

  integration-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-
      - name: Install
        run: pnpm run ci:install
      - name: Doctor
        run: pnpm doctor
      - name: Build
        run: pnpm -C apps/cli build
      - name: MCP smoke client example
        run: |
          set -o pipefail
          pnpm mcp:smoke:example 2>&1 | tee mcp-smoke.log
      - name: Smoke checks
        run: |
          set -o pipefail
          pnpm smoke 2>&1 | tee smoke.log
      - name: Bench harness (warn-only on PR)
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          pnpm bench:run:pr 2>&1 | tee bench-pr.log
      - name: Bench harness (enforced on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          pnpm bench:run 2>&1 | tee bench-main.log
      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: |
            bench/artifacts/
            mcp-smoke.log
            smoke.log
            bench-pr.log
            bench-main.log

  full-lane:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, integration-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm run ci:install
      - name: Full verification suite
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee full-lane.log
      - name: Upload full lane log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-lane-log
          path: full-lane.log

  ci-gate:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, integration-smoke, full-lane]
    if: always()
    steps:
      - name: Enforce lane success
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-smoke.result }}" != "success" ]; then
            echo "PR lane failed"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ needs.full-lane.result }}" != "success" ]; then
            echo "Main full lane failed"
            exit 1
          fi
          echo "CI lanes passed"

  docker:
    runs-on: ubuntu-latest
    needs: ci-gate
    env:
      ZEO_DOCKER_IMAGE: zeolite:dev
      ZEO_DOCKER_BASELINE_IMAGE: zeolite:baseline
      ZEO_DOCKER_MAX_COMPRESSED_BYTES: '250000000'
      ZEO_DOCKER_MAX_DELTA_COMPRESSED_BYTES: '25000000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm run ci:install
      - name: Build baseline Docker image
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          git worktree add /tmp/zeo-base "origin/${{ github.base_ref }}"
          docker build -t "$ZEO_DOCKER_BASELINE_IMAGE" /tmp/zeo-base
      - name: Docker smoke
        run: pnpm docker:smoke
      - name: Docker size assert
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm docker:size:assert
          else
            ZEO_DOCKER_BASELINE_IMAGE='' pnpm docker:size:assert
          fi
      - name: MCP smoke (docker)
        run: pnpm mcp:smoke:docker
