name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install
        run: pnpm i --frozen-lockfile=false
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Build Web
        run: pnpm -C apps/web build
      - name: Web E2E Tests
        run: pnpm -C apps/web test:e2e
        continue-on-error: false
      - name: Build CLI
        run: pnpm -C apps/cli build
      - name: Replay Sample Dataset
        run: pnpm -C apps/cli start -- --replay external/examples/replay/sample_dataset.json --report-out /tmp/zeo-replay
      - name: Verify Replay Reports
        run: |
          test -f /tmp/zeo-replay/replay_results.json
          test -f /tmp/zeo-replay/calibration_report.md
