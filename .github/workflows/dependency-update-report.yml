name: Dependency Update Report

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/dependency-update-report.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-update-report
          path: docs/generated/dependency-update-report.md
