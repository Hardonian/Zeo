<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80" role="img" aria-label="Four transparency badges: Deterministic, Auditable, Replayable, Bounded">
  <title>Design Guarantees: Deterministic, Auditable, Replayable, Bounded</title>

  <!-- === BADGE 1: Deterministic === -->
  <!-- Hexagon cx=45 cy=32 -->
  <polygon points="45,12 62,22 62,42 45,52 28,42 28,22" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <!-- Icon: fn() -->
  <text x="45" y="37" font-family="ui-monospace, monospace" font-size="11" fill="#2563eb" text-anchor="middle">fn()</text>
  <!-- Label -->
  <text x="45" y="68" font-family="ui-monospace, monospace" font-size="8" fill="#374151" text-anchor="middle">Deterministic</text>

  <!-- === BADGE 2: Auditable === -->
  <!-- Hexagon cx=135 cy=32 -->
  <polygon points="135,12 152,22 152,42 135,52 118,42 118,22" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <!-- Icon: ledger lines -->
  <line x1="124" y1="27" x2="146" y2="27" stroke="#2563eb" stroke-width="1.2"/>
  <line x1="124" y1="33" x2="146" y2="33" stroke="#2563eb" stroke-width="1.2"/>
  <line x1="124" y1="39" x2="140" y2="39" stroke="#2563eb" stroke-width="1.2"/>
  <!-- Label -->
  <text x="135" y="68" font-family="ui-monospace, monospace" font-size="8" fill="#374151" text-anchor="middle">Auditable</text>

  <!-- === BADGE 3: Replayable === -->
  <!-- Hexagon cx=225 cy=32 -->
  <polygon points="225,12 242,22 242,42 225,52 208,42 208,22" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <!-- Icon: circular arrow arc -->
  <path d="M218,32 A7,7 0 1 1 232,32" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <!-- Arrowhead at arc end -->
  <path d="M230,29 L233,32 L230,35" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Label -->
  <text x="225" y="68" font-family="ui-monospace, monospace" font-size="8" fill="#374151" text-anchor="middle">Replayable</text>

  <!-- === BADGE 4: Bounded === -->
  <!-- Hexagon cx=315 cy=32 -->
  <polygon points="315,12 332,22 332,42 315,52 298,42 298,22" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <!-- Icon: [ ] brackets with center dot -->
  <path d="M305,25 L302,25 L302,39 L305,39" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M325,25 L328,25 L328,39 L325,39" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="315" cy="32" r="2" fill="#2563eb"/>
  <!-- Label -->
  <text x="315" y="68" font-family="ui-monospace, monospace" font-size="8" fill="#374151" text-anchor="middle">Bounded</text>
</svg>
