<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="280" height="180" role="img" aria-label="Value of Information diagram">
  <title>VOI: evidence sources flow into a decision node, confidence delta shows posterior narrowing</title>
  <rect width="280" height="180" fill="#f8fafc"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="voi-solid" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="voi-dashed" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="voi-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- === CENTRAL DECISION NODE === -->
  <circle cx="140" cy="90" r="22" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="140" cy="90" r="7" fill="#2563eb" fill-opacity="0.8"/>
  <text x="140" y="125" font-family="ui-monospace, monospace" font-size="7" fill="#6b7280" text-anchor="middle">decision</text>

  <!-- === EVIDENCE SOURCE BOXES === -->
  <!-- Source A -->
  <rect x="8" y="38" width="50" height="18" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="33" y="50" font-family="ui-monospace, monospace" font-size="8" fill="#6b7280" text-anchor="middle">source A</text>
  <!-- Arrow A → node -->
  <line x1="58" y1="47" x2="118" y2="80" stroke="#2563eb" stroke-width="1.5" marker-end="url(#voi-solid)"/>

  <!-- Source B -->
  <rect x="8" y="81" width="50" height="18" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="33" y="93" font-family="ui-monospace, monospace" font-size="8" fill="#6b7280" text-anchor="middle">source B</text>
  <!-- Arrow B → node -->
  <line x1="58" y1="90" x2="118" y2="90" stroke="#2563eb" stroke-width="1.5" marker-end="url(#voi-solid)"/>

  <!-- Source C (unconfirmed, dashed) -->
  <rect x="8" y="124" width="50" height="18" rx="3" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
  <text x="33" y="136" font-family="ui-monospace, monospace" font-size="8" fill="#9ca3af" text-anchor="middle">source C</text>
  <!-- Arrow C → node (dashed = unconfirmed) -->
  <line x1="58" y1="133" x2="118" y2="100" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#voi-dashed)"/>

  <!-- === CONFIDENCE DELTA (right of node) === -->
  <!-- Prior uncertainty bar (wide) -->
  <rect x="175" y="64" width="10" height="52" rx="1" fill="#2563eb" fill-opacity="0.12"/>
  <text x="180" y="58" font-family="ui-monospace, monospace" font-size="7" fill="#9ca3af" text-anchor="middle">prior</text>
  <!-- Bracket ticks for prior -->
  <line x1="172" y1="64" x2="186" y2="64" stroke="#9ca3af" stroke-width="0.8"/>
  <line x1="172" y1="116" x2="186" y2="116" stroke="#9ca3af" stroke-width="0.8"/>

  <!-- Posterior uncertainty bar (narrower) -->
  <rect x="192" y="74" width="10" height="32" rx="1" fill="#2563eb" fill-opacity="0.35"/>
  <text x="197" y="68" font-family="ui-monospace, monospace" font-size="7" fill="#6b7280" text-anchor="middle">posterior</text>
  <!-- Bracket ticks for posterior -->
  <line x1="189" y1="74" x2="205" y2="74" stroke="#16a34a" stroke-width="0.8"/>
  <line x1="189" y1="106" x2="205" y2="106" stroke="#16a34a" stroke-width="0.8"/>

  <!-- Delta label -->
  <text x="218" y="92" font-family="ui-monospace, monospace" font-size="7" fill="#16a34a">Δconf</text>

  <!-- Connecting line node → delta area -->
  <line x1="162" y1="90" x2="172" y2="90" stroke="#d1d5db" stroke-width="1" stroke-dasharray="2,2"/>
</svg>
