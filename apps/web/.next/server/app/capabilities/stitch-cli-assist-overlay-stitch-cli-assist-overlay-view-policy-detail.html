om running without verification.\n                        \u003c/p\u003e\n\u003c/section\u003e\n\u003c!-- Enforcement Level --\u003e\n\u003csection\u003e\n\u003ch4 class=\"text-slate-500 dark:text-slate-400 text-xs font-bold uppercase tracking-widest mb-3\"\u003eEnforcement Level\u003c/h4\u003e\n\u003cdiv class=\"inline-flex items-center gap-3 bg-primary/10 dark:bg-primary/20 border border-primary/30 rounded-lg p-3 w-full\"\u003e\n\u003cspan class=\"material-symbols-outlined text-primary\"\u003elock_clock\u003c/span\u003e\n\u003cdiv\u003e\n\u003cp class=\"text-slate-900 dark:text-white font-bold text-sm\"\u003eHard Block / Required Step\u003c/p\u003e\n\u003cp class=\"text-slate-600 dark:text-slate-400 text-xs\"\u003eExecution is prevented until all conditions are met.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c!-- Remediation --\u003e\n\u003csection class=\"bg-slate-50 dark:bg-slate-800/40 rounded-xl p-5 border border-slate-100 dark:border-slate-800\"\u003e\n\u003cdiv class=\"flex items-center gap-2 mb-4\"\u003e\n\u003cspan class=\"material-symbols-outlined text-primary\"\u003eauto_fix_high\u003c/span\u003e\n\u003ch4 class=\"text-slate-900 dark:text-white text-sm font-bold\"\u003eHow to Fix\u003c/h4\u003e\n\u003c/div\u003e\n\u003cdiv class=\"space-y-4\"\u003e\n\u003cdiv class=\"flex gap-4\"\u003e\n\u003cdiv class=\"flex-none flex items-center justify-center size-6 rounded-full bg-primary text-white text-xs font-bold\"\u003e1\u003c/div\u003e\n\u003cp class=\"text-slate-700 dark:text-slate-300 text-sm leading-snug\"\u003eClick the \u003cspan class=\"font-mono bg-slate-200 dark:bg-slate-700 px-1.5 py-0.5 rounded text-xs font-bold\"\u003e\"Dry Run\"\u003c/span\u003e button in the header toolbar.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"flex gap-4\"\u003e\n\u003cdiv class=\"flex-none flex items-center justify-center size-6 rounded-full bg-primary text-white text-xs font-bold\"\u003e2\u003c/div\u003e\n\u003cp class=\"text-slate-700 dark:text-slate-300 text-sm leading-snug\"\u003eReview the predicted side effects in the output console.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"flex gap-4\"\u003e\n\u003cdiv class=\"flex-none flex items-center justify-center size-6 rounded-full bg-primary text-white text-xs font-bold\"\u003e3\u003c/div\u003e\n\u003cp class=\"text-slate-700 dark:text-slate-300 text-sm leading-snug\"\u003eProceed to execution once the check passes and the \"Execute\" button is enabled.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/div\u003e\n\u003c!-- Footer Actions --\u003e\n\u003cdiv class=\"p-6 border-t border-slate-100 dark:border-slate-800 flex flex-col sm:flex-row gap-3\"\u003e\n\u003cbutton class=\"flex-1 flex items-center justify-center h-12 rounded-lg bg-primary hover:bg-primary/90 text-white font-bold transition-all shadow-lg shadow-primary/20\"\u003e\n                        Close Detail\n                    \u003c/button\u003e\n\u003cbutton class=\"flex-1 flex items-center justify-center h-12 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold transition-all\"\u003e\n                        View Full Org Policies\n                    \u003c/button\u003e\n\u003c/div\u003e\n\u003c!-- Bottom spacer for safe area --\u003e\n\u003cdiv class=\"h-4 bg-white dark:bg-[#111722]\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003c/body\u003e\u003c/html\u003e"])</script><script>self.__next_f.push([1,"6:[\"$\",\"div\",null,{\"className\":\"min-h-screen bg-gray-50\",\"children\":[[\"$\",\"header\",null,{\"className\":\"bg-white border-b border-gray-200 py-4 px-6 md:px-8 sticky top-0 z-20\",\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-7xl mx-auto flex items-center justify-between\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-4\",\"children\":[[\"$\",\"$L5\",null,{\"href\":\"/
