<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Intervention Dialog Modal - Zeo</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#2563EB", // Strong Royal Blue for primary actions
                        danger: "#DC2626",
                        warning: "#F59E0B",
                        "warning-light": "#FFFBEB",
                        "warning-dark": "#451a03",
                        "background-light": "#F3F4F6", // Light gray background
                        "background-dark": "#0F172A", // Dark slate background
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#1E293B",
                        "border-light": "#E2E8F0",
                        "border-dark": "#334155",
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                        mono: ["JetBrains Mono", "monospace"],
                    },
                    boxShadow: {
                        'modal': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                    }
                },
            },
        };
    </script>
<style>.json-scroll::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .json-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .json-scroll::-webkit-scrollbar-thumb {
            background-color: #CBD5E1;
            border-radius: 4px;
        }
        .dark .json-scroll::-webkit-scrollbar-thumb {
            background-color: #475569;
        }body {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-sans text-slate-800 dark:text-slate-200 min-h-screen flex items-center justify-center p-4">
<div aria-hidden="true" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 transition-opacity"></div>
<div class="relative w-full max-w-md bg-surface-light dark:bg-surface-dark rounded-2xl shadow-modal overflow-hidden z-50 border border-border-light dark:border-border-dark flex flex-col max-h-[90vh]">
<div class="px-5 py-4 border-b border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark flex items-center justify-between shrink-0">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-red-100 dark:bg-red-900/30 flex items-center justify-center shrink-0">
<span class="material-icons-round text-red-600 dark:text-red-400 text-lg">error_outline</span>
</div>
<div>
<h2 class="text-lg font-semibold text-slate-900 dark:text-white leading-tight">Action Required</h2>
<p class="text-xs text-slate-500 dark:text-slate-400">Runner ID: <span class="font-mono">run-ax92-f4</span></p>
</div>
</div>
<button class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
<span class="material-icons-round">close</span>
</button>
</div>
<div class="flex-1 overflow-y-auto p-5 json-scroll">
<div class="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800/50 rounded-lg p-3 mb-5 flex gap-3">
<span class="material-icons-round text-amber-600 dark:text-amber-400 shrink-0 mt-0.5">warning</span>
<div>
<h3 class="text-sm font-medium text-amber-800 dark:text-amber-200">Validation Failure Detected</h3>
<p class="text-xs text-amber-700 dark:text-amber-300/80 mt-1 leading-relaxed">
                        The runner encountered a schema mismatch in the payload. Retrying without modification may result in a crash.
                    </p>
</div>
</div>
<div class="mb-4">
<label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-2">Failure Reason</label>
<div class="bg-slate-50 dark:bg-slate-800/50 rounded-md p-3 border border-border-light dark:border-border-dark">
<code class="text-xs text-red-600 dark:text-red-400 font-mono break-all">Error: Invalid property 'timestamp_ms' expected number, got string.</code>
</div>
</div>
<div>
<div class="flex items-center justify-between mb-2">
<label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wide">Input Overrides</label>
<button class="text-xs text-primary hover:text-blue-600 font-medium flex items-center gap-1">
<span class="material-icons-round text-[14px]">history</span>
                        Restore Default
                    </button>
</div>
<div class="relative group">
<div class="absolute right-2 top-2 opacity-0 group-hover:opacity-100 transition-opacity">
<button class="p-1 rounded bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300" title="Format JSON">
<span class="material-icons-round text-sm">code</span>
</button>
</div>
<textarea class="w-full h-48 bg-slate-900 text-slate-300 font-mono text-xs p-3 rounded-lg border border-slate-700 focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-none leading-relaxed json-scroll" spellcheck="false">{
  "task_id": "gen_8821",
  "priority": "high",
  "payload": {
    "timestamp_ms": 1699402100,
    "retry_strategy": "exponential",
    "context": {
        "region": "us-east-1",
        "shards": 4
    }
  }
}</textarea>
<div class="mt-1 flex justify-end">
<span class="text-[10px] text-green-600 dark:text-green-400 flex items-center gap-1">
<span class="material-icons-round text-[10px]">check_circle</span> Valid JSON
                        </span>
</div>
</div>
</div>
</div>
<div class="p-5 border-t border-border-light dark:border-border-dark bg-slate-50 dark:bg-slate-800/30 shrink-0 flex flex-col gap-3">
<button class="w-full bg-primary hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg shadow-sm active:transform active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-icons-round text-sm">edit_note</span>
                Retry with Overrides
            </button>
<div class="grid grid-cols-2 gap-3">
<button class="w-full bg-white dark:bg-slate-700 border border-border-light dark:border-slate-600 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-600 font-medium py-2.5 px-4 rounded-lg shadow-sm active:transform active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm">
<span class="material-icons-round text-sm">replay</span>
                    Retry Same
                </button>
<button class="w-full bg-transparent border border-transparent text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 font-medium py-2.5 px-4 rounded-lg active:transform active:scale-[0.98] transition-all text-sm">
                    Acknowledge
                </button>
</div>
</div>
</div>
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none opacity-20 dark:opacity-10">
<div class="absolute -top-[50%] -left-[50%] w-[200%] h-[200%] bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-indigo-200 via-slate-100 to-transparent dark:from-indigo-900 dark:via-slate-900"></div>
</div>

</body></html>
