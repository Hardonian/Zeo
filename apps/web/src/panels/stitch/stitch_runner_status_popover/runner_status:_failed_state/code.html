<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Runner Status: Failed</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#136dec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                        "error-red": "#ef4444",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Space Grotesk', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">
<!-- Popover Container -->
<div class="relative w-full max-w-md bg-white dark:bg-[#1a1a1a] border border-slate-200 dark:border-white/10 shadow-2xl overflow-hidden rounded">
<!-- Header Section -->
<div class="flex items-center justify-between p-4 border-b border-slate-200 dark:border-white/5 bg-background-light dark:bg-background-dark/50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-error-red animate-pulse">error</span>
<h2 class="text-sm font-bold uppercase tracking-widest">Runner Status: Failed</h2>
</div>
<button class="p-1 hover:bg-slate-200 dark:hover:bg-white/10 rounded transition-colors">
<span class="material-symbols-outlined text-xl leading-none">close</span>
</button>
</div>
<!-- Hero Status Section -->
<div class="p-5 space-y-4">
<div class="flex items-start justify-between">
<div class="space-y-1">
<h3 class="text-2xl font-bold leading-tight tracking-tight">Execution Failed</h3>
<p class="text-slate-500 dark:text-slate-400 text-sm">Step B failed at 14:02:31 UTC</p>
</div>
<div class="px-2 py-1 bg-error-red/10 border border-error-red/20 rounded-sm">
<span class="text-error-red text-[10px] font-bold uppercase tracking-tighter">SIGTERM</span>
</div>
</div>
<!-- Diagnostic Card -->
<div class="bg-slate-50 dark:bg-black/40 border border-slate-200 dark:border-white/5 p-4 rounded-sm flex items-center gap-4">
<div class="size-10 bg-error-red/20 rounded flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-error-red">terminal</span>
</div>
<div>
<p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Diagnostic</p>
<p class="text-sm font-medium">Process terminated with Exit Code 1</p>
</div>
</div>
</div>
<!-- Workflow Stepper -->
<div class="px-5 pb-6">
<div class="space-y-0 relative">
<!-- Step A -->
<div class="grid grid-cols-[40px_1fr] gap-x-2">
<div class="flex flex-col items-center gap-1">
<div class="flex size-6 items-center justify-center rounded-full bg-emerald-500/20 text-emerald-500">
<span class="material-symbols-outlined text-lg">check_circle</span>
</div>
<div class="w-px bg-slate-300 dark:bg-white/10 h-8"></div>
</div>
<div class="flex flex-col pb-4">
<p class="text-sm font-bold">Step A: Initialization</p>
<p class="text-xs text-slate-500 uppercase tracking-wide">Success</p>
</div>
</div>
<!-- Step B (FAILED) -->
<div class="grid grid-cols-[40px_1fr] gap-x-2">
<div class="flex flex-col items-center gap-1">
<div class="flex size-6 items-center justify-center rounded-full bg-error-red text-white ring-4 ring-error-red/20">
<span class="material-symbols-outlined text-lg">cancel</span>
</div>
<div class="w-px bg-slate-300 dark:bg-white/10 h-8"></div>
</div>
<div class="flex flex-col pb-4">
<p class="text-sm font-bold text-error-red">Step B: Runtime Execution</p>
<p class="text-xs text-error-red/80 font-medium">Failed at Offset 0x442</p>
</div>
</div>
<!-- Step C -->
<div class="grid grid-cols-[40px_1fr] gap-x-2">
<div class="flex flex-col items-center gap-1">
<div class="flex size-6 items-center justify-center rounded-full bg-slate-200 dark:bg-white/10 text-slate-400">
<span class="material-symbols-outlined text-lg">block</span>
</div>
</div>
<div class="flex flex-col">
<p class="text-sm font-bold text-slate-400">Step C: Cleanup &amp; Dispatch</p>
<p class="text-xs text-slate-500 uppercase tracking-wide">Cancelled</p>
</div>
</div>
</div>
</div>
<!-- Action Toolbar -->
<div class="grid grid-cols-3 gap-px bg-slate-200 dark:bg-white/10 border-t border-slate-200 dark:border-white/10">
<button class="bg-white dark:bg-[#1a1a1a] hover:bg-slate-50 dark:hover:bg-white/5 py-4 flex flex-col items-center gap-1 transition-colors group">
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">refresh</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Rerun</span>
</button>
<button class="bg-white dark:bg-[#1a1a1a] hover:bg-slate-50 dark:hover:bg-white/5 py-4 flex flex-col items-center gap-1 transition-colors group">
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">list_alt</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Logs</span>
</button>
<button class="bg-primary hover:bg-primary/90 py-4 flex flex-col items-center gap-1 transition-colors text-white">
<span class="material-symbols-outlined">data_object</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Intervene</span>
</button>
</div>
<!-- Footer Visual Decor -->
<div class="h-1 bg-gradient-to-r from-error-red via-primary to-error-red bg-[length:200%_auto] opacity-50"></div>
</div>
</body></html>
