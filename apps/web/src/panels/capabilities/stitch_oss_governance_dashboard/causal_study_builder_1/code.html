<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Causal Study Builder</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "surface-dark": "#1c2633",
                        "border-dark": "#2d3b4e",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for technical feel */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #101922; 
        }
        ::-webkit-scrollbar-thumb {
            background: #2d3b4e; 
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #137fec; 
        }
        
        /* Checkbox custom styling to match the technical vibe */
        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            background-color: transparent;
            margin: 0;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased min-h-screen flex flex-col overflow-x-hidden">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 bg-background-light dark:bg-background-dark border-b border-gray-200 dark:border-border-dark">
<div class="flex items-center justify-between px-4 py-3">
<button class="flex items-center justify-center w-10 h-10 rounded hover:bg-black/5 dark:hover:bg-white/5 transition-colors text-slate-600 dark:text-slate-400">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="text-base font-bold tracking-tight">Causal Study Builder</h1>
<span class="text-[10px] font-mono text-primary uppercase tracking-widest">Draft Mode • v1.0.4</span>
</div>
<div class="w-10 h-10 flex items-center justify-center">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-400">more_vert</span>
</div>
</div>
<!-- Progress Indicator -->
<div class="h-[2px] w-full bg-gray-200 dark:bg-border-dark">
<div class="h-full w-2/3 bg-primary"></div>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col p-4 gap-6 max-w-md mx-auto w-full">
<!-- Section 1: Intervention Definition -->
<section class="flex flex-col gap-2">
<div class="flex items-center justify-between">
<h2 class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest flex items-center gap-2">
<span class="material-symbols-outlined text-sm">edit_note</span>
                    Intervention Definition
                </h2>
<span class="font-mono text-[10px] text-slate-400 dark:text-slate-600">data-bind:input_01</span>
</div>
<div class="bg-white dark:bg-surface-dark border border-gray-200 dark:border-border-dark rounded-lg overflow-hidden group focus-within:border-primary transition-colors">
<div class="bg-gray-50 dark:bg-black/20 px-3 py-2 border-b border-gray-200 dark:border-border-dark flex justify-between items-center">
<label class="text-xs font-mono text-slate-500 dark:text-slate-400">Candidate Intervention</label>
<div class="flex gap-1">
<span class="w-2 h-2 rounded-full bg-red-500/50"></span>
<span class="w-2 h-2 rounded-full bg-yellow-500/50"></span>
<span class="w-2 h-2 rounded-full bg-green-500/50"></span>
</div>
</div>
<div class="relative">
<!-- Line numbers imitation -->
<div class="absolute left-0 top-0 bottom-0 w-8 bg-gray-50 dark:bg-black/10 border-r border-gray-200 dark:border-border-dark flex flex-col items-center pt-3 gap-[2px] text-[10px] font-mono text-slate-400 select-none">
<span>1</span>
<span>2</span>
<span>3</span>
<span>4</span>
<span>5</span>
</div>
<textarea class="w-full h-32 pl-10 pr-3 py-2 bg-transparent border-none text-sm font-mono text-slate-800 dark:text-slate-200 focus:ring-0 placeholder:text-slate-400/50 resize-none leading-relaxed" placeholder="// Define treatment assignment mechanism here...
if (X &gt; threshold) {
  treatment = 1;
} else {
  treatment = 0;
}" spellcheck="false"></textarea>
</div>
<div class="px-3 py-1 bg-gray-50 dark:bg-black/20 border-t border-gray-200 dark:border-border-dark flex justify-end">
<span class="text-[10px] font-mono text-slate-400">Ln 1, Col 1</span>
</div>
</div>
</section>
<!-- Section 2: Required Assumptions -->
<section class="flex flex-col gap-2">
<div class="flex items-center justify-between">
<h2 class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest flex items-center gap-2">
<span class="material-symbols-outlined text-sm">fact_check</span>
                    Required Assumptions
                </h2>
<span class="font-mono text-[10px] text-slate-400 dark:text-slate-600">data-panel:checklist</span>
</div>
<div class="bg-white dark:bg-surface-dark border border-gray-200 dark:border-border-dark rounded-lg flex flex-col divide-y divide-gray-200 dark:divide-border-dark">
<!-- Assumption Item 1 -->
<label class="group relative flex items-start gap-3 p-4 cursor-pointer hover:bg-gray-50 dark:hover:bg-white/5 transition-colors">
<div class="relative flex items-center mt-0.5">
<input class="peer h-5 w-5 cursor-pointer appearance-none rounded border border-slate-300 dark:border-slate-500 checked:border-primary checked:bg-primary transition-all" type="checkbox"/>
<span class="material-symbols-outlined absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-white opacity-0 peer-checked:opacity-100 text-sm pointer-events-none">check</span>
</div>
<div class="flex-1">
<div class="flex justify-between items-center mb-1">
<span class="text-sm font-medium text-slate-700 dark:text-slate-200">SUTVA holds across units</span>
<span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500 border border-slate-200 dark:border-slate-700">DAG-01</span>
</div>
<p class="text-xs text-slate-500 dark:text-slate-400 leading-tight">Stable Unit Treatment Value Assumption verified for current population.</p>
</div>
</label>
<!-- Assumption Item 2 -->
<label class="group relative flex items-start gap-3 p-4 cursor-pointer hover:bg-gray-50 dark:hover:bg-white/5 transition-colors">
<div class="relative flex items-center mt-0.5">
<input class="peer h-5 w-5 cursor-pointer appearance-none rounded border border-slate-300 dark:border-slate-500 checked:border-primary checked:bg-primary transition-all" type="checkbox"/>
<span class="material-symbols-outlined absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-white opacity-0 peer-checked:opacity-100 text-sm pointer-events-none">check</span>
</div>
<div class="flex-1">
<div class="flex justify-between items-center mb-1">
<span class="text-sm font-medium text-slate-700 dark:text-slate-200">No unobserved confounding</span>
<span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500 border border-slate-200 dark:border-slate-700">DAG-04</span>
</div>
<p class="text-xs text-slate-500 dark:text-slate-400 leading-tight">All back-door paths are blocked by the conditioning set.</p>
</div>
</label>
<!-- Assumption Item 3 -->
<label class="group relative flex items-start gap-3 p-4 cursor-pointer hover:bg-gray-50 dark:hover:bg-white/5 transition-colors">
<div class="relative flex items-center mt-0.5">
<input class="peer h-5 w-5 cursor-pointer appearance-none rounded border border-slate-300 dark:border-slate-500 checked:border-primary checked:bg-primary transition-all" type="checkbox"/>
<span class="material-symbols-outlined absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-white opacity-0 peer-checked:opacity-100 text-sm pointer-events-none">check</span>
</div>
<div class="flex-1">
<div class="flex justify-between items-center mb-1">
<span class="text-sm font-medium text-slate-700 dark:text-slate-200">Positivity assumption met</span>
<span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500 border border-slate-200 dark:border-slate-700">STAT-02</span>
</div>
<p class="text-xs text-slate-500 dark:text-slate-400 leading-tight">Treatment assignment probability is strictly between 0 and 1.</p>
</div>
</label>
<!-- Assumption Item 4 -->
<label class="group relative flex items-start gap-3 p-4 cursor-pointer hover:bg-gray-50 dark:hover:bg-white/5 transition-colors">
<div class="relative flex items-center mt-0.5">
<input class="peer h-5 w-5 cursor-pointer appearance-none rounded border border-slate-300 dark:border-slate-500 checked:border-primary checked:bg-primary transition-all" type="checkbox"/>
<span class="material-symbols-outlined absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-white opacity-0 peer-checked:opacity-100 text-sm pointer-events-none">check</span>
</div>
<div class="flex-1">
<div class="flex justify-between items-center mb-1">
<span class="text-sm font-medium text-slate-700 dark:text-slate-200">Instrument exclusion restriction</span>
<span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500 border border-slate-200 dark:border-slate-700">IV-01</span>
</div>
<p class="text-xs text-slate-500 dark:text-slate-400 leading-tight">Instrument affects outcome only via the treatment.</p>
</div>
</label>
</div>
</section>
<!-- Spacer to push footer down if needed, but in this high density layout it just sits below -->
<div class="flex-1 min-h-[20px]"></div>
<!-- Section 3: Execution Gate -->
<section class="sticky bottom-4 z-10">
<div class="bg-white/80 dark:bg-surface-dark/90 backdrop-blur-md border border-gray-200 dark:border-border-dark rounded-xl p-4 shadow-lg shadow-black/20">
<div class="mb-4">
<label class="flex items-center gap-3 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-5 w-5 cursor-pointer appearance-none rounded border border-slate-400 dark:border-slate-500 checked:border-primary checked:bg-primary transition-all" id="gatekeeper" type="checkbox"/>
<span class="material-symbols-outlined absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-white opacity-0 peer-checked:opacity-100 text-sm pointer-events-none">check</span>
</div>
<span class="text-xs font-semibold text-slate-700 dark:text-slate-300 select-none group-hover:text-primary transition-colors">I acknowledge the structural assumptions</span>
</label>
</div>
<button class="group w-full h-12 flex items-center justify-center gap-2 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-400 dark:text-slate-500 font-bold tracking-wide cursor-not-allowed transition-all has-[:checked]:bg-primary has-[:checked]:text-white has-[:checked]:shadow-lg has-[:checked]:shadow-primary/30 has-[:checked]:cursor-pointer relative overflow-hidden">
<!-- Invisible checkbox trick to simulate state change without JS for visual demo purposes. In a real app, JS would toggle the button disabled attribute. -->
<input class="absolute inset-0 opacity-0 cursor-pointer z-10 w-full h-full" onclick="document.getElementById('gatekeeper').checked = true;" type="checkbox"/>
<span class="material-symbols-outlined text-[20px] transition-transform group-active:scale-95">play_circle</span>
<span class="transition-transform group-active:scale-95">EXECUTE STUDY</span>
<!-- Decorative scanner line for tech effect -->
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite] pointer-events-none"></div>
</button>
</div>
</section>
</main>
<!-- Footer Status -->
<footer class="bg-background-light dark:bg-background-dark py-4 px-6 text-center border-t border-gray-200 dark:border-border-dark">
<div class="flex justify-center items-center gap-4 text-[10px] text-slate-400 font-mono">
<span>STUDY-ID-492</span>
<span>|</span>
<span class="flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                SYSTEM READY
            </span>
</div>
</footer>
</body></html>
